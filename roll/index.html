<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>RollMates</title>
<meta property="og:title" content="RollMates">
<meta property="og:image" content="https://rollmates.adamgilani.com/logo.png">
<meta property="og:description" content="A roll shared on RollMates.">
<style>
  :root { --bg:#fff; --text:#111; --muted:#5f5f5f; --surface:#f3f3f1; --accent:#FAB711; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0b; --text:#f2f2f2; --muted:#a3a3a3; --surface:#1a1a1a; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font:17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { width:100%; max-width:420px; padding:32px 20px; text-align:center; }
  .mark { width:72px; height:72px; border-radius:17px; display:block; margin:0 auto 20px; }
  h1 { font-size:28px; line-height:1.15; margin:0 0 10px; letter-spacing:-0.02em; }
  p { color:var(--muted); margin:0 0 28px; }
  a.button { display:block; padding:16px; border-radius:999px; font-weight:700; text-decoration:none; margin-bottom:12px; }
  #open { background:var(--accent); color:#111; }
  #get { background:var(--surface); color:var(--text); }
  small { color:var(--muted); display:block; margin-top:18px; font-size:13px; }
  .preview { display:none; width:min(100%, 36vh); margin:0 auto 22px; border-radius:22px; overflow:hidden; background:var(--surface);
             box-shadow:0 14px 40px rgba(0,0,0,.18); }
  .preview img { display:block; width:100%; height:auto; }
  .owner { display:none; align-items:center; justify-content:center; gap:10px; margin:0 0 6px; color:var(--muted); font-size:15px; }
  .owner img { width:28px; height:28px; border-radius:50%; object-fit:cover; background:var(--surface); }
  body.has-preview .mark { display:none; }
  body.has-preview .preview, body.has-preview .owner { display:block; }
  body.has-preview .owner { display:flex; }
</style>
</head>
<body data-kind="roll">
<main>
  <img class="mark" src="../logo.png" alt="RollMates">
  <div class="preview"><img id="preview" alt=""></div>
  <div class="owner"><img id="avatar" alt=""><span id="owner"></span></div>
  <h1 id="title">RollMates</h1>
  <p id="line"></p>
  <a class="button" id="open" href="#">Open in RollMates</a>
  <a class="button" id="get" href="#">Get RollMates</a>
  <small>RollMates is in beta on TestFlight for iPhone.</small>
</main>
<script src="../link.js"></script>
</body>
</html>
